<script>
const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a, F=x=>Math.abs(x)>=1e4||(Math.abs(x)<1e-2&&x!==0)?x.toExponential(2):+x.toPrecision(4);
const pol=(c)=>c.map(([a,n])=>`${a<0?'−':'+'} ${Math.abs(a)}${n?'x'+(n>1?'^'+n:''):''}`).join(' ').replace(/^\+ /,'');
const T={
mates:[
{id:'alg',n:'Álgebra',h:`<span class="tag">Bloque D · Sentido algebraico</span><h3>Matrices</h3><ul><li>Producto A·B (m×n por n×p): fila×columna. <b>No conmutativo</b>; <code>(AB)ᵗ=BᵗAᵗ</code>, <code>(AB)⁻¹=B⁻¹A⁻¹</code>.</li><li>Inversa: <code>A⁻¹=<span class='fr'><span>Adj(A)ᵗ</span><span>|A|</span></span></code>, existe ⇔ |A|≠0.</li><li>Ecuaciones: <code>AX=B ⇒ X=A⁻¹B</code>; <code>XA=B ⇒ X=BA⁻¹</code> (el orden importa).</li><li>Rango: nº de filas linealmente independientes (Gauss o menores).</li></ul><h3>Determinantes</h3><ul><li>Sarrus (3×3). <code>|Aᵗ|=|A|</code>, <code>|AB|=|A||B|</code>, <code>|kA|=kⁿ|A|</code>.</li><li>Cambiar 2 filas cambia el signo; filas proporcionales o de ceros ⇒ |A|=0; sumar a una fila combinación de otras no lo altera.</li></ul><h3>Sistemas</h3><div class="box th"><b class="l">Teorema</b><b>Rouché–Frobenius</b>: rg(A)=rg(A|b)=n → SCD; rg(A)=rg(A|b)=r&lt;n → SCI (n−r parámetros); rg(A)&lt;rg(A|b) → SI.</div><ul><li>Cramer (SCD): <code>xᵢ=<span class='fr'><span>|Aᵢ|</span><span>|A|</span></span></code>. Homogéneo: siempre compatible; solución no trivial ⇔ |A|=0.</li></ul><div class="box tip"><b class="l">Ojo en el examen</b>Con parámetro m: resuelve |A|=0, obtén los valores críticos y discute <b>cada caso por separado</b> (rangos de A y A|b).</div>`,g:()=>{const M=Array.from({length:3},()=>Array.from({length:3},()=>R(-3,4)));const d=M[0][0]*(M[1][1]*M[2][2]-M[1][2]*M[2][1])-M[0][1]*(M[1][0]*M[2][2]-M[1][2]*M[2][0])+M[0][2]*(M[1][0]*M[2][1]-M[1][1]*M[2][0]);return{q:'Calcula el determinante y di si A es invertible:\n'+M.map(r=>'  ( '+r.join('  ')+' )').join('\n'),a:`|A| = ${d}. `+(d?'Es invertible (|A|≠0).':'No es invertible (|A|=0).')}}},
{id:'geo',n:'Geometría',h:`<span class="tag">Bloque C · Sentido espacial</span><h3>Vectores</h3><ul><li>Escalar: <code>u·v=|u||v|cosα=u₁v₁+u₂v₂+u₃v₃</code>; perpendiculares ⇔ u·v=0.</li><li>Vectorial: u×v ⟂ u y v; <code>|u×v|=|u||v|sinα</code> = área del paralelogramo (triángulo: ½).</li><li>Mixto: <code>[u,v,w]=u·(v×w)</code>; volumen paralelepípedo = |[u,v,w]|, tetraedro = ⅙|[u,v,w]|.</li></ul><h3>Rectas y planos</h3><ul><li>Recta: punto P y director v (vectorial, paramétricas, continua, implícitas = 2 planos).</li><li>Plano: <code>Ax+By+Cz+D=0</code>, normal n=(A,B,C). Por P y dos vectores: determinante 3×3 = 0.</li><li>Posiciones relativas: estudia rg(M) y rg(M*) del sistema (secantes, paralelas, coincidentes, se cruzan).</li></ul><h3>Distancias y ángulos</h3><ul><li>Punto–plano: <code><span class='fr'><span>|Ax₀+By₀+Cz₀+D|</span><span>√(A²+B²+C²)</span></span></code></li><li>Punto–recta: <code><span class='fr'><span>|PQ×v|</span><span>|v|</span></span></code> · Rectas que se cruzan: <code><span class='fr'><span>|[PQ,u,v]|</span><span>|u×v|</span></span></code></li><li>Recta–recta: <code>cosα=<span class='fr'><span>|u·v|</span><span>|u||v|</span></span></code> · Recta–plano: <code>sinα=<span class='fr'><span>|u·n|</span><span>|u||n|</span></span></code> · Plano–plano: <code>cosα=<span class='fr'><span>|n·n′|</span><span>|n||n′|</span></span></code></li></ul><div class="box tip"><b class="l">Ojo en el examen</b>Pregunta competencial (contexto real): modela con un sistema de ejes, define puntos, y <b>explica</b> cada paso en una frase.</div>`,g:()=>{const A=R(1,5),B=R(-4,4),C=R(1,5),D=R(-6,6),x=R(-3,3),y=R(-3,3),z=R(-3,3);const d=Math.abs(A*x+B*y+C*z+D)/Math.sqrt(A*A+B*B+C*C);return{q:`Calcula la distancia del punto P(${x}, ${y}, ${z}) al plano π: ${A}x ${B<0?'−':'+'} ${Math.abs(B)}y + ${C}z ${D<0?'−':'+'} ${Math.abs(D)} = 0`,a:`d = |${A*x+B*y+C*z+D}| / √${A*A+B*B+C*C} ≈ ${F(d)} u`}}},
{id:'der',n:'Derivadas',h:`<span class="tag">Bloque B · Sentido B · Análisis</span><h3>Límites y continuidad</h3><ul><li>Indeterminaciones: 0/0, ∞/∞, ∞−∞, 0·∞, 1^∞ → <code>e^{lim g·(f−1)}</code>. Regla de L’Hôpital para 0/0 y ∞/∞.</li><li>f continua en a ⇔ <code>lim f(x)=f(a)</code> (límites laterales iguales). Discontinuidad: evitable, de salto, asintótica.</li></ul><div class="box th"><b class="l">Teorema</b><b>Bolzano</b>: f continua en [a,b] y f(a)·f(b)&lt;0 ⇒ ∃c con f(c)=0. <b>Weierstrass</b>: continua en [a,b] ⇒ tiene máx y mín. <b>Rolle</b>: continua en [a,b], derivable en (a,b), f(a)=f(b) ⇒ ∃c: f′(c)=0. <b>Lagrange</b>: <code>f′(c)=<span class='fr'><span>f(b)−f(a)</span><span>b−a</span></span></code>. <i>Comprueba siempre las hipótesis.</i></div><h3>Derivadas</h3><ul><li><code>(xⁿ)′=nxⁿ⁻¹</code> · <code>(eˣ)′=eˣ</code> · <code>(aˣ)′=aˣln a</code> · <code>(ln x)′=<span class='fr'><span>1</span><span>x</span></span></code> · <code>(sin)′=cos</code> · <code>(cos)′=−sin</code> · <code>(tan)′=1+tan²</code> · <code>(arcsin)′=<span class='fr'><span>1</span><span>√(1−x²)</span></span></code> · <code>(arctan)′=<span class='fr'><span>1</span><span>1+x²</span></span></code></li><li><code>(fg)′=f′g+fg′</code> · <code>(<span class='fr'><span>f</span><span>g</span></span>)′=<span class='fr'><span>f′g−fg′</span><span>g²</span></span></code> · cadena <code>(f∘g)′=f′(g)·g′</code>. Para fᵍ: derivación logarítmica.</li><li>Tangente en a: <code>y−f(a)=f′(a)(x−a)</code>.</li></ul><h3>Estudio de funciones</h3><ul><li>Dominio, cortes, simetrías, asíntotas (vertical: lim=±∞; horizontal: lim en ±∞; oblicua <code>y=mx+n</code>, m=lim f/x, n=lim(f−mx)).</li><li>f′&gt;0 crece, f′&lt;0 decrece; extremos donde f′=0 y cambia el signo. f″&gt;0 convexa (∪), f″&lt;0 cóncava (∩); inflexión si f″ cambia de signo.</li></ul><div class="box ex"><b class="l">Ejemplo</b><b>Optimización</b>: 1) función objetivo, 2) ligadura y despeja, 3) f′=0, 4) comprueba máx/mín con f″, 5) responde con unidades.</div>`,g:()=>{const c=[[R(1,5),3],[R(-6,6)||2,2],[R(-7,7)||1,1]],x0=R(-2,3);const d=[[c[0][0]*3,2],[c[1][0]*2,1],[c[2][0],0]];const v=d.reduce((s,[a,n])=>s+a*x0**n,0);return{q:`Dada f(x) = ${pol(c)}, halla f'(x), f'(${x0}) y los intervalos de crecimiento.`,a:`f'(x) = ${pol(d)}\nf'(${x0}) = ${v}\nCrecimiento: estudia el signo de f'(x) (raíces de ${pol(d)} = 0).`}}},
{id:'int',n:'Integrales',h:`<span class="tag">Bloque B · Sentido B · Análisis</span><h3>Primitivas</h3><ul><li><code>∫xⁿdx=<span class='fr'><span>xⁿ⁺¹</span><span>n+1</span></span></code> (n≠−1) · <code>∫ <span class='fr'><span>1</span><span>x</span></span> dx=ln|x|</code> · <code>∫eˣ=eˣ</code> · <code>∫aˣ=<span class='fr'><span>aˣ</span><span>ln a</span></span></code></li><li><code>∫cos=sin</code> · <code>∫sin=−cos</code> · <code>∫ <span class='fr'><span>1</span><span>cos²x</span></span> dx=tan x</code> · <code>∫ <span class='fr'><span>1</span><span>√(1−x²)</span></span> dx=arcsin x</code> · <code>∫ <span class='fr'><span>1</span><span>1+x²</span></span> dx=arctan x</code></li><li>Compuestas: <code>∫ <span class='fr'><span>f′</span><span>f</span></span> dx=ln|f|</code> · <code>∫f′fⁿ=<span class='fr'><span>fⁿ⁺¹</span><span>n+1</span></span></code></li></ul><h3>Métodos</h3><ul><li><b>Partes</b>: <code>∫u dv=uv−∫v du</code>. Elige u por orden ALPES (arco, logarítmica, polinómica, exponencial, seno/coseno).</li><li><b>Cambio de variable</b>: t=g(x), dt=g′(x)dx; en definidas cambia también los límites.</li><li><b>Racionales</b>: si grado N ≥ grado D, divide; después fracciones simples (raíces reales simples o múltiples).</li></ul><div class="box ex"><b class="l">Ejemplo</b><code>∫x·eˣdx</code>: u=x, dv=eˣdx ⇒ <code>xeˣ−∫eˣdx=(x−1)eˣ+C</code></div><h3>Integral definida y áreas</h3><ul><li><b>Barrow</b>: <code>∫ₐᵇ f=F(b)−F(a)</code>. Teorema fundamental: <code>F(x)=∫ₐˣ f ⇒ F′=f</code>.</li><li>Área entre curvas: <code>∫(techo−suelo)dx</code>; halla los puntos de corte y <b>divide</b> el intervalo si las curvas se cruzan.</li></ul><div class="box tip"><b class="l">Ojo en el examen</b>Un área nunca sale negativa: si te da negativa, has cambiado techo y suelo o falta el valor absoluto.</div>`,g:()=>{const a=R(1,4),b=R(-5,5)||1,c=R(-4,4),k=R(1,4);const r=a*k**3/3+b*k**2/2+c*k;return{q:`Calcula ∫₀^${k} (${a}x² ${b<0?'−':'+'} ${Math.abs(b)}x ${c<0?'−':'+'} ${Math.abs(c)}) dx`,a:`F(x) = ${a}x³/3 ${b<0?'−':'+'} ${Math.abs(b)}x²/2 ${c<0?'−':'+'} ${Math.abs(c)}x\nResultado = ${F(r)}`}}},
{id:'prob',n:'Probabilidad',h:`<span class="tag">Bloque E · Sentido E · Probabilidad y Estadística</span><h3>Probabilidad</h3><ul><li>Condicionada: <code>P(A|B)=<span class='fr'><span>P(A∩B)</span><span>P(B)</span></span></code>. Independientes ⇔ <code>P(A∩B)=P(A)P(B)</code>.</li><li>Prob. total: <code>P(B)=ΣP(Aᵢ)P(B|Aᵢ)</code>. <b>Bayes</b>: <code>P(Aᵢ|B)=<span class='fr'><span>P(Aᵢ)P(B|Aᵢ)</span><span>P(B)</span></span></code>.</li><li>Ayuda: diagrama de árbol o tabla de contingencia.</li></ul><h3>Variable binomial B(n,p)</h3><ul><li><code>P(X=k)=C(n,k)·pᵏ·qⁿ⁻ᵏ</code>, q=1−p · <code>μ=np</code>, <code>σ=√(npq)</code>.</li></ul><h3>Variable normal N(μ,σ)</h3><ul><li>Tipificar: <code>Z=<span class='fr'><span>X−μ</span><span>σ</span></span></code>. <code>P(Z≤−a)=1−P(Z≤a)</code>. Regla 68–95–99,7.</li><li>Binomial → normal si np≥5 y nq≥5: N(np,√(npq)) con corrección de continuidad (±0,5).</li><li>Discreta general: <code>E(X)=Σxᵢpᵢ</code>, <code>Var=E(X²)−μ²</code>.</li></ul><div class="box tip"><b class="l">Ojo en el examen</b>Escribe siempre qué probabilidad buscas (<code>P(X≥3)</code>) <i>antes</i> de calcular y usa el complementario cuando sea más corto.</div>`,g:()=>{const n=R(4,10),k=R(1,n-1),p=[.2,.3,.4,.5,.6][R(0,4)];const C=(n,k)=>{let r=1;for(let i=1;i<=k;i++)r=r*(n-k+i)/i;return r};const P=C(n,k)*p**k*(1-p)**(n-k);return{q:`X ~ B(${n}, ${p}). Calcula P(X = ${k}) y la media.`,a:`P = C(${n},${k})·${p}^${k}·${+(1-p).toFixed(2)}^${n-k} ≈ ${F(P)}\nμ = np = ${F(n*p)}`}}}],
fisica:[
{id:'grav',n:'Campo gravitatorio',h:`<span class="tag">Bloque 1 · Campo gravitatorio</span><h3>Interacción</h3><ul><li>Newton: <code>F=<span class='fr'><span>GMm</span><span>r²</span></span></code> (atractiva, central, conservativa). <code>g=<span class='fr'><span>GM</span><span>r²</span></span></code>; en superficie <code>g₀=<span class='fr'><span>GM</span><span>R²</span></span></code>.</li><li>Kepler: 1ª órbitas elípticas; 2ª áreas iguales en tiempos iguales (L=cte); 3ª <code>T²=<span class='fr'><span>4π²r³</span><span>GM</span></span></code>.</li><li>Momento angular: <code>L=r×mv</code> se conserva (fuerza central).</li></ul><h3>Energía</h3><ul><li><code>Eₚ=−<span class='fr'><span>GMm</span><span>r</span></span></code> · <code>V=−<span class='fr'><span>GM</span><span>r</span></span></code> · <code>W=−ΔEₚ=−mΔV</code>.</li><li>Órbita circular: <code>v=√(<span class='fr'><span>GM</span><span>r</span></span>)</code>, <code>E_c=<span class='fr'><span>GMm</span><span>2r</span></span></code>, <code>E=−<span class='fr'><span>GMm</span><span>2r</span></span></code>.</li><li>Velocidad de escape: <code>vₑ=√(<span class='fr'><span>2GM</span><span>R</span></span>)</code> (E total = 0).</li><li>Cambio de órbita: <code>ΔE=E₂−E₁</code> (energía a aportar).</li></ul><div class="box tip"><b class="l">Ojo en el examen</b>Usa r = R + h (desde el <b>centro</b>), pasa km a m y no mezcles g₀ con g(h).</div>`,g:()=>{const h=R(2,20)*100,G=6.67e-11,M=5.97e24,Rt=6.37e6,r=Rt+h*1e3;return{q:`Un satélite orbita a ${h} km sobre la Tierra (M=5,97·10²⁴ kg, R=6370 km). Calcula g en esa órbita y su velocidad orbital.`,a:`r = ${F(r)} m\ng = GM/r² ≈ ${F(G*M/r**2)} m∕s²\nv = √(GM/r) ≈ ${F(Math.sqrt(G*M/r))} m∕s`}}},
{id:'elec',n:'Campo eléctrico',h:`<span class="tag">Bloque 2 · Campo electromagnético</span><h3>Campo eléctrico</h3><ul><li>Coulomb: <code>F=<span class='fr'><span>Kq₁q₂</span><span>r²</span></span></code>, K=9·10⁹ N·m²∕C². <code>E=<span class='fr'><span>Kq</span><span>r²</span></span></code> · <code>V=<span class='fr'><span>Kq</span><span>r</span></span></code> · <code>Eₚ=<span class='fr'><span>Kq₁q₂</span><span>r</span></span></code>.</li><li><code>W=q(V_A−V_B)=−ΔEₚ</code>. Campo uniforme: <code>E=<span class='fr'><span>ΔV</span><span>d</span></span></code>.</li><li>Gauss: <code>Φ=<span class='fr'><span>Q_int</span><span>ε₀</span></span></code>. Fuera de una esfera cargada: como carga puntual; dentro de un conductor E=0.</li><li>Líneas de campo salen de + y entran en −; ⟂ a las superficies equipotenciales; las cargas + van hacia V menor.</li></ul><div class="box tip"><b class="l">Ojo en el examen</b>E es vector (suma vectorial), V es escalar (suma con signo). Dibuja el esquema antes de sumar.</div>`,g:()=>{const q1=R(1,9),q2=-R(1,9),d=R(10,60);const F1=9e9*Math.abs(q1*q2)*1e-12/(d/100)**2;return{q:`Dos cargas q₁=${q1} μC y q₂=${q2} μC están separadas ${d} cm en el vacío. Calcula la fuerza entre ellas y el potencial en el punto medio.`,a:`F = K|q₁q₂|/r² ≈ ${F(F1)} N (atractiva)\nV = K(q₁+q₂)/(r/2) ≈ ${F(9e9*(q1+q2)*1e-6/(d/200))} V`}}},
{id:'mag',n:'Magnetismo e inducción',h:`<span class="tag">Bloque 2 · Campo electromagnético</span><h3>Campo magnético</h3><ul><li>Lorentz: <code>F=q(v×B)</code> (no realiza trabajo). Movimiento circular: <code>R=<span class='fr'><span>mv</span><span>qB</span></span></code>, <code>T=<span class='fr'><span>2πm</span><span>qB</span></span></code>. Selector de velocidades: <code>v=<span class='fr'><span>E</span><span>B</span></span></code>.</li><li>Sobre un conductor: <code>F=I(L×B)</code>. Entre corrientes paralelas: misma dirección se atraen.</li><li>Hilo: <code>B=<span class='fr'><span>μ₀I</span><span>2πd</span></span></code> · Espira (centro): <code>B=<span class='fr'><span>μ₀I</span><span>2R</span></span></code> · Solenoide: <code>B=<span class='fr'><span>μ₀NI</span><span>L</span></span></code>; μ₀=4π·10⁻⁷ T·m∕A.</li></ul><h3>Inducción</h3><ul><li><code>Φ=B·S·cosθ</code> · <b>Faraday–Lenz</b>: <code>ε=−<span class='fr'><span>dΦ</span><span>dt</span></span></code> (el signo − : se opone a la variación).</li><li>Alternador: <code>ε=NBSω·sin(ωt)</code>. Transformador: <code><span class='fr'><span>V₁</span><span>V₂</span></span>=<span class='fr'><span>N₁</span><span>N₂</span></span></code>.</li></ul><div class="box tip"><b class="l">Ojo en el examen</b>Regla de la mano derecha: ojo con el signo de la carga (electrón ⇒ sentido contrario).</div>`,g:()=>{const v=R(1,9)*1e5,B=R(1,9)*1e-2;const r=9.11e-31*v/(1.6e-19*B);return{q:`Un electrón entra perpendicularmente a un campo B=${B} T con v=${F(v)} m∕s. Calcula el radio de su órbita y el periodo.`,a:`R = mv/(qB) ≈ ${F(r)} m\nT = 2πm/(qB) ≈ ${F(2*Math.PI*9.11e-31/(1.6e-19*B))} s`}}},
{id:'ond',n:'Ondas y óptica',h:`<span class="tag">Bloque 3 · Vibraciones y ondas</span><h3>MAS</h3><ul><li><code>x=A·sin(ωt+φ)</code> · <code>v=Aω·cos(ωt+φ)</code> · <code>a=−ω²x</code> · <code>F=−kx</code>.</li><li><code>ω=√(<span class='fr'><span>k</span><span>m</span></span>)</code>, <code>T=2π√(<span class='fr'><span>m</span><span>k</span></span>)</code> · Péndulo: <code>T=2π√(<span class='fr'><span>l</span><span>g</span></span>)</code> · <code>E=½kA²</code>.</li></ul><h3>Ondas</h3><ul><li><code>y=A·sin(ωt−kx+φ)</code> (hacia +x) · <code>ω=2πf</code>, <code>k=<span class='fr'><span>2π</span><span>λ</span></span></code>, <code>v=λf=<span class='fr'><span>ω</span><span>k</span></span></code>.</li><li>Intensidad <code>I=<span class='fr'><span>P</span><span>4πr²</span></span></code> · nivel sonoro <code>β=10·log(<span class='fr'><span>I</span><span>I₀</span></span>)</code>, I₀=10⁻¹² W∕m².</li><li>Interferencia: constructiva <code>Δr=nλ</code>, destructiva <code>Δr=(n+½)λ</code>. Estacionarias (extremos fijos): <code>L=<span class='fr'><span>nλ</span><span>2</span></span></code>.</li></ul><h3>Óptica</h3><ul><li>Snell: <code>n₁sinθ₁=n₂sinθ₂</code> · <code>n=<span class='fr'><span>c</span><span>v</span></span></code> · ángulo límite <code>sinθ_L=<span class='fr'><span>n₂</span><span>n₁</span></span></code> (n₁&gt;n₂).</li><li>Lente delgada (normas DIN): <code><span class='fr'><span>1</span><span>s′</span></span>−<span class='fr'><span>1</span><span>s</span></span>=<span class='fr'><span>1</span><span>f′</span></span></code>, aumento <code><span class='fr'><span>y′</span><span>y</span></span>=<span class='fr'><span>s′</span><span>s</span></span></code>, potencia <code>P=<span class='fr'><span>1</span><span>f′</span></span></code> (dioptrías).</li></ul>`,g:()=>{const A=R(1,8)/10,f=R(2,50),l=R(1,20)/10;return{q:`Una onda y(x,t)=${A}·sin(2π(${f}t − x/${l})) (SI). Halla λ, f, v y la expresión de la velocidad transversal máxima.`,a:`λ = ${l} m, f = ${f} Hz\nv = λf = ${F(l*f)} m∕s\nvₘₐₓ = Aω = ${F(A*2*Math.PI*f)} m∕s`}}},{id:'mod',n:'Física moderna',h:`<span class="tag">Bloque 4 · Física relativista, cuántica, nuclear y de partículas</span><h3>Relatividad especial</h3><ul><li><code>γ=<span class='fr'><span>1</span><span>√(1−<span class='fr'><span>v²</span><span>c²</span></span>)</span></span></code> · dilatación <code>Δt=γΔt₀</code> · contracción <code>L=<span class='fr'><span>L₀</span><span>γ</span></span></code> · <code>E=γmc²</code>, <code>E₀=mc²</code>.</li></ul><h3>Cuántica</h3><ul><li><code>E=hf</code> · efecto fotoeléctrico: <code>hf=W₀+E_c,máx</code>, <code>f₀=<span class='fr'><span>W₀</span><span>h</span></span></code>, <code>eV_frenado=E_c</code>.</li><li>De Broglie: <code>λ=<span class='fr'><span>h</span><span>p</span></span></code> · incertidumbre: <code>Δx·Δp≥<span class='fr'><span>ħ</span><span>2</span></span></code> · saltos de nivel: <code>hf=E_i−E_f</code>.</li></ul><h3>Nuclear</h3><ul><li>Defecto de masa <code>Δm=Zm_p+Nm_n−m_núcleo</code>; <code>E_enlace=Δm·c²</code>.</li><li><code>N=N₀e^{−λt}</code> · <code>T½=<span class='fr'><span>ln2</span><span>λ</span></span></code> · actividad <code>A=λN</code>. Fisión y fusión liberan energía (E/A mayor en el producto).</li></ul><p class="muted">h=6,63·10⁻³⁴ J·s · c=3·10⁸ m∕s · e=1,6·10⁻¹⁹ C · hc≈1240 eV·nm</p>`,g:()=>{const W=R(20,43)/10,l=R(150,280),E=1240/l;return{q:`Un metal tiene trabajo de extracción W₀ = ${W} eV. Se ilumina con luz de λ = ${l} nm. Calcula la energía del fotón y la energía cinética máxima de los electrones (hc = 1240 eV·nm).`,a:`E = hc/λ ≈ ${F(E)} eV\nE_c,máx = E − W₀ ≈ ${F(E-W)} eV`}}}]};
const INFO={mates:`<b>Examen UIB · Matemáticas II</b> (según la web de la UIB, curso 2025-26): 5 preguntas de 2 puntos. <b>Parte A</b> (obligatorias): P1 competencial contextualizada (fijada en Geometría), P2 Análisis, P3 Probabilidad y Estadística (fijada). <b>Parte B</b>: P4 y P5, eliges 1 de 2. Máx. 90 min, sin calculadora gráfica ni programable, boli de colores salvo rojo y verde. <i>Confirma en estudis.uib.cat qué bloque queda fijado este curso y el modelo oficial.</i>`,fisica:`<b>Examen UIB · Física</b>: 4 bloques de saberes (RD 243/2022): gravitatorio, electromagnético, ondas y física moderna. La UIB publica una guía y un formulario oficial de Física PBAU (dfs.uib.es/apl/aac/fisicapbau) y las actas con la estructura del examen. <i>No he podido leer la estructura exacta de este curso: míralo en esas actas.</i>`};
const MORE={"Matrices": "<p><b>Tipos</b></p><ul><li>Cuadrada, diagonal, identidad I, triangular, <b>simétrica</b> (A=Aᵗ), <b>antisimétrica</b> (A=−Aᵗ), <b>ortogonal</b> (AAᵗ=I), regular (invertible).</li></ul><p><b>Propiedades que caen</b></p><ul><li>A(B+C)=AB+AC · AI=IA=A · en general <b>AB≠BA</b> · AB=0 <b>no</b> implica A=0 ó B=0 · (A+B)²≠A²+2AB+B² (hay que desarrollar con cuidado).</li><li>Matriz adjunta: <code>Aᵢⱼ=(−1)ⁱ⁺ʲ·menor</code>.</li></ul><p><b>Potencias Aⁿ</b></p><ul><li>Calcula A², A³, A⁴, busca el patrón y demuéstralo por <b>inducción</b>. Si A=I+N con N²=0: <code>Aⁿ=I+nN</code>.</li></ul><p><b>Inversa por Gauss</b></p><ul><li>Escribe (A|I) y haz operaciones por filas hasta (I|A⁻¹). Si aparece fila de ceros, no es invertible.</li></ul><p><b>Rango</b></p><ul><li>Rango = orden del mayor menor distinto de 0 = nº de filas independientes. Por Gauss: nº de filas no nulas.</li></ul><div class='box tip'><b class='l'>Errores típicos</b>Confundir AB con BA · creer que AB=0 obliga a A=0 ó B=0 · invertir con |A|=0 · mezclar operaciones por filas y por columnas en Gauss.</div>", "Determinantes": "<p><b>Cálculo</b></p><ul><li>2×3: <code>|a b|c d|=ad−bc</code>. Para 3×3 usa Sarrus o <b>Laplace</b>: desarrolla por la fila/columna con más ceros, <code>|A|=Σ aᵢⱼ·Aᵢⱼ</code>.</li><li>Haz ceros antes (F₂→F₂−2F₁ no cambia el valor); triangular: |A|=producto de la diagonal.</li></ul><p><b>Más propiedades</b></p><ul><li><code>|A⁻¹|=<span class='fr'><span>1</span><span>|A|</span></span></code> · si una fila es suma de dos, el determinante se descompone en suma · sacar factor común de una fila saca el factor del determinante.</li><li><b>|A|≠0 ⇔ rg=n ⇔ filas independientes ⇔ A invertible.</b></li></ul><p><b>Con parámetros</b></p><ul><li>Calcula |A| factorizado (m−1)(m+2)… así ves directamente los valores críticos.</li></ul><div class='box tip'><b class='l'>Errores típicos</b>Olvidar el cambio de signo al intercambiar filas · |A+B|≠|A|+|B| · <code>|kA|=kⁿ|A|</code> y no k|A|.</div>", "Sistemas": "<p><b>Método de Gauss</b></p><ul><li>Escalona la matriz ampliada con operaciones entre filas; lee el tipo y resuelve de abajo a arriba. Sirve siempre (también no cuadrados).</li></ul><p><b>Discusión con parámetro (receta)</b></p><ul><li>1) Calcula |A| (si cuadrada) y halla los m que lo anulan. 2) Para m distinto: rg(A)=rg(A*)=n ⇒ SCD. 3) Para <b>cada</b> m crítico sustituye y calcula rg(A) y rg(A*) por separado. 4) Si pide resolver, hazlo en cada caso (SCD: Cramer o Gauss; SCI: parámetros).</li></ul><p><b>Detalles</b></p><ul><li>SCI con rg=r y n incógnitas: n−r parámetros. Homogéneo: solución trivial siempre; infinitas ⇔ |A|=0.</li><li>Problemas: define incógnitas, traduce frases a ecuaciones, resuelve y <b>comprueba el sentido</b> de la solución (¿negativos? ¿enteros?).</li></ul><div class='box tip'><b class='l'>Errores típicos</b>Discutir solo con |A|=0 y olvidar rg(A*) · no estudiar cada valor crítico por separado · dejar un SCI sin parámetros.</div>", "Vectores": "<p><b>Conceptos</b></p><ul><li>Módulo <code>|u|=√(u₁²+u₂²+u₃²)</code>; unitario <code><span class='fr'><span>u</span><span>|u|</span></span></code>; vector entre puntos <code>AB=B−A</code>.</li><li>Dependencia lineal: u,v,w son independientes ⇔ rg=3 ⇔ <code>[u,v,w]≠0</code>. Coplanares ⇔ mixto = 0.</li></ul><p><b>Puntos</b></p><ul><li>Punto medio <code>M=<span class='fr'><span>A+B</span><span>2</span></span></code> · baricentro <code>G=<span class='fr'><span>A+B+C</span><span>3</span></span></code> · simétrico de A respecto a M: <code>A′=2M−A</code>.</li></ul><p><b>Producto vectorial</b></p><ul><li>Anticonmutativo <code>u×v=−v×u</code>, <code>u×u=0</code>, paralelos ⇔ u×v=0. Dirección: regla de la mano derecha. Se calcula con el determinante (i j k | u | v).</li><li>Ángulo: <code>cosα=<span class='fr'><span>u·v</span><span>|u||v|</span></span></code>; proyección de u sobre v: <code><span class='fr'><span>u·v</span><span>|v|</span></span></code>.</li></ul><div class='box tip'><b class='l'>Errores típicos</b>Hacer u×v al revés (cambia el signo) · confundir u·v (número) con u×v (vector).</div>", "Rectas": "<p><b>Paso entre formas</b></p><ul><li>Implícitas → director: <code>v=n₁×n₂</code>; un punto: da valor a una variable y resuelve. Paramétricas → implícitas: elimina λ.</li><li>Recta por A y B: punto A, director AB.</li></ul><p><b>Planos</b></p><ul><li>Por 3 puntos: <code>n=AB×AC</code>. Paralelo a otro: mismos (A,B,C). Perpendicular a una recta: n=v.</li><li>Plano que contiene a una recta y a un punto: <b>haz de planos</b> <code>α(A₁x+B₁y+C₁z+D₁)+β(…)=0</code> y exige que pase por P.</li><li>Plano que contiene a r y es paralelo a s: punto de r, vectores v_r y v_s.</li></ul><p><b>Posiciones relativas</b></p><ul><li>Rectas: compara directores. Paralelos y un punto común → coincidentes. No paralelos: <b>mixto</b> [PQ,u,v]=0 ⇒ secantes; ≠0 ⇒ se cruzan.</li><li>Recta–plano: v·n=0 → paralela (o contenida); v·n≠0 → secante. Planos: n proporcionales → paralelos/coincidentes.</li></ul><div class='box tip'><b class='l'>Errores típicos</b>Usar el vector director como normal sin querer · no comprobar que el punto pertenece al plano o la recta.</div>", "Distancias": "<p><b>Proyecciones y simétricos</b></p><ul><li><b>Proyección de P sobre un plano</b>: recta que pasa por P con director n; córtala con el plano. Simétrico P′ = 2·proyección − P.</li><li><b>Proyección sobre una recta</b>: plano por P perpendicular a la recta (n=v); córtalo con la recta.</li></ul><p><b>Perpendicular común a r y s</b></p><ul><li>Dirección w=u×v; plano que contiene a r y w; plano que contiene a s y w; la intersección es la perpendicular común.</li></ul><p><b>Aplicaciones</b></p><ul><li>Área del triángulo ABC = ½|AB×AC| · volumen del tetraedro = ⅙|[AB,AC,AD]|.</li><li>Distancia entre planos paralelos = distancia de un punto de uno al otro.</li></ul><div class='box tip'><b class='l'>Errores típicos</b>Olvidar dividir entre el módulo de n · confundir distancia punto-recta con punto-plano.</div>", "Límites": "<p><b>Infinitos y equivalentes</b></p><ul><li>Orden: <code>logₐx ≪ xⁿ ≪ aˣ ≪ x!</code> (a&gt;1). Con x→0: <code>sin x~x, tan x~x, ln(1+x)~x, eˣ−1~x, 1−cos x~<span class='fr'><span>x²</span><span>2</span></span></code>.</li><li>Notables: <code>lim <span class='fr'><span>sin x</span><span>x</span></span>=1</code>, <code>lim(1+<span class='fr'><span>1</span><span>x</span></span>)ˣ=e</code>.</li></ul><p><b>Continuidad con parámetros</b></p><ul><li>A trozos: iguala <b>límites laterales</b> y f(a). Cada tipo de discontinuidad se prueba con laterales: finitos distintos → salto; infinito → asintótica; iguales pero ≠f(a) → evitable.</li></ul><p><b>Resolver indeterminaciones</b></p><ul><li>∞−∞: multiplica por el conjugado o saca común. 0·∞: pasa a cociente. ∞/∞: divide por la mayor potencia. L’Hôpital: solo para 0/0 y ∞/∞, derivando numerador y denominador por separado.</li></ul><div class='box tip'><b class='l'>Errores típicos</b>Aplicar L’Hôpital sin ser 0/0 ó ∞/∞ · olvidar los límites laterales en funciones a trozos.</div>", "Derivadas": "<p><b>Definición</b></p><ul><li><code>f′(a)=lim <span class='fr'><span>f(a+h)−f(a)</span><span>h</span></span></code>. Derivable ⇒ continua (el recíproco es falso: |x| en 0).</li><li>A trozos: 1º continuidad, 2º derivadas laterales iguales (con las derivadas de cada trozo).</li></ul><p><b>Más reglas</b></p><ul><li>Función inversa: <code>(f⁻¹)′(b)=<span class='fr'><span>1</span><span>f′(a)</span></span></code>, b=f(a). Implícita: deriva y despeja y′. Logarítmica para <code>y=f(x)^g(x)</code>: ln y=g·ln f.</li><li>Derivadas sucesivas: f″, f‴ (necesarias para curvatura y Taylor básico).</li></ul><p><b>Extremos absolutos en [a,b]</b></p><ul><li>Evalúa f en los extremos locales (f′=0) <b>y en a y b</b>; el mayor es el máximo, el menor el mínimo (Weierstrass).</li></ul><div class='box tip'><b class='l'>Errores típicos</b>Olvidar la regla de la cadena · concluir extremo solo con f′=0 · no comprobar las hipótesis de Rolle o Lagrange.</div>", "Estudio": "<p><b>Esquema (8 pasos)</b></p><ul><li>1) Dominio · 2) simetrías (<code>f(−x)=f(x)</code> par, <code>=−f(x)</code> impar) y periodicidad · 3) cortes con ejes · 4) signo · 5) asíntotas (verticales en lo que anula el denominador; horizontales y oblicuas con límites en ±∞) · 6) f′: monotonía y extremos · 7) f″: curvatura e inflexión · 8) tabla y gráfica.</li></ul><p><b>Trucos</b></p><ul><li>Si hay asíntota horizontal en +∞, no hay oblicua por ese lado. Racionales: si grado N = grado D + 1, hay oblicua (divide).</li><li>Un extremo relativo <b>necesita</b> f′=0 (o no derivable); <code>f′=0</code> y <code>f″&gt;0</code> ⇒ mínimo, <code>f″&lt;0</code> ⇒ máximo.</li></ul><div class='box tip'><b class='l'>Errores típicos</b>Olvidar el dominio · calcular oblicua habiendo horizontal · no justificar la monotonía con el signo de f′.</div>", "Primitivas": "<p><b>Propiedades</b></p><ul><li>Linealidad: <code>∫(af+bg)=a∫f+b∫g</code>. Toda primitiva se diferencia en una constante C.</li><li><code>∫ <span class='fr'><span>1</span><span>ax+b</span></span> dx=(<span class='fr'><span>1</span><span>a</span></span>)ln|ax+b|</code> · <code>∫tan x=−ln|cos x|</code> · <code>∫ <span class='fr'><span>1</span><span>x²+a²</span></span> dx=(<span class='fr'><span>1</span><span>a</span></span>)arctan(<span class='fr'><span>x</span><span>a</span></span>)</code>.</li></ul><p><b>Trigonométricas</b></p><ul><li><code>cos²x=<span class='fr'><span>1+cos2x</span><span>2</span></span></code>, <code>sin²x=<span class='fr'><span>1−cos2x</span><span>2</span></span></code> ⇒ <code>∫sin²x=<span class='fr'><span>x</span><span>2</span></span>−<span class='fr'><span>sin2x</span><span>4</span></span>+C</code>. Siempre puedes comprobar derivando el resultado.</li></ul><div class='box tip'><b class='l'>Errores típicos</b>Olvidar +C · escribir ln x sin valor absoluto · no comprobar derivando.</div>", "Métodos": "<p><b>Partes</b></p><ul><li>Cíclicas (<code>∫eˣsin x</code>): aplica partes dos veces, reaparece la integral inicial y la despejas. Si u=ln x o arc: elige u así.</li></ul><p><b>Cambios habituales</b></p><ul><li>√x=t · eˣ=t · ln x=t · en funciones con raíz de ax+b: t=raíz. Cambia dx y los límites.</li></ul><p><b>Fracciones simples</b></p><ul><li>Raíz simple: <code><span class='fr'><span>A</span><span>x−a</span></span></code> · múltiple: <code><span class='fr'><span>A</span><span>x−a</span></span>+<span class='fr'><span>B</span><span>(x−a)²</span></span></code> · cuadrático irreducible: <code><span class='fr'><span>Ax+B</span><span>x²+bx+c</span></span></code> → logaritmo + arcotangente.</li><li>Coeficientes: sustituye en las raíces (rápido) o iguala polinomios.</li></ul><div class='box tip'><b class='l'>Errores típicos</b>Cambiar de variable sin cambiar dx ni los límites · elegir mal u en partes.</div>", "Integral": "<p><b>Propiedades</b></p><ul><li><code>∫ₐᵃ=0</code> · <code>∫ₐᵇ=−∫ᵦₐ</code> · aditividad <code>∫ₐᵇ=∫ₐᶜ+∫ᶜᵇ</code> · si f≥0 ⇒ ∫≥0. Valor medio: ∃c con <code>∫ₐᵇf=f(c)(b−a)</code>.</li><li>Derivada de una integral: <code><span class='fr'><span>d</span><span>dx</span></span> ∫ₐ^{g(x)}f(t)dt=f(g(x))·g′(x)</code> (Barrow + cadena).</li></ul><p><b>Áreas paso a paso</b></p><ul><li>1) Dibuja o halla cortes. 2) Decide techo/suelo en cada tramo. 3) Integra por tramos. 4) Si f cruza el eje, <b>área=∫|f|</b> separando donde cambia el signo. 5) Unidades: u².</li></ul><div class='box tip'><b class='l'>Errores típicos</b>Dar un área negativa · no dividir el intervalo cuando la curva cruza el eje.</div>", "Probabilidad": "<p><b>Axiomas y reglas</b></p><ul><li>P(A)≥0, P(E)=1, aditividad. <code>P(Ā)=1−P(A)</code> · <code>P(A∪B)=P(A)+P(B)−P(A∩B)</code> · De Morgan: <code>(A∪B)ᶜ=Aᶜ∩Bᶜ</code>.</li><li>Laplace: casos favorables / posibles. <b>Incompatibles ≠ independientes</b> (incompatibles con P&gt;0 son dependientes).</li></ul><p><b>Combinatoria</b></p><ul><li>Permutaciones <code>n!</code> · variaciones <code><span class='fr'><span>n!</span><span>(n−k)!</span></span></code> (importa orden) · combinaciones <code>C(n,k)=<span class='fr'><span>n!</span><span>k!(n−k)!</span></span></code>.</li></ul><p><b>Método</b></p><ul><li>Dibuja el árbol, escribe qué es cada rama y recuerda que Bayes es “al revés” del árbol: <code>P(A|B)=<span class='fr'><span>P(A∩B)</span><span>P(B)</span></span></code> con P(B) por probabilidad total.</li></ul><div class='box tip'><b class='l'>Errores típicos</b>Sumar probabilidades de sucesos no incompatibles · confundir P(A|B) con P(B|A).</div>", "Variable binomial": "<p><b>Cuándo es binomial</b></p><ul><li>n pruebas independientes, dos resultados (éxito/fracaso), p constante. Si no, no lo es (extracciones sin reposición → hipergeométrica).</li></ul><p><b>Cálculo</b></p><ul><li><code>P(X≥k)=1−P(X≤k−1)</code> es lo habitual. <code>σ²=npq</code>. La moda es la parte entera de (n+1)p aprox.</li></ul><div class='box tip'><b class='l'>Errores típicos</b>Usar binomial sin independencia · no usar el complementario.</div>", "Variable normal": "<p><b>Propiedades</b></p><ul><li>Campana simétrica en μ, área total 1, <code>P(X≤μ)=0,5</code>. Tipificar convierte cualquier N(μ,σ) en N(0,1).</li></ul><p><b>Percentiles</b></p><ul><li>Buscar z con <code>P(Z≤z)=0,95</code> ⇒ z=1,645; después <code>x=μ+zσ</code>.</li></ul><p><b>Aproximar binomial</b></p><ul><li><code>P(X=k)≈P(k−0,5&lt;Y&lt;k+0,5)</code> · <code>P(X≤k)≈P(Y≤k+0,5)</code> · <code>P(X≥k)≈P(Y≥k−0,5)</code>.</li></ul><div class='box tip'><b class='l'>Errores típicos</b>Olvidar tipificar · no usar P(Z≤−a)=1−P(Z≤a) · olvidar la corrección de continuidad.</div>", "Interacción": "<p><b>Campo de varias masas</b></p><ul><li>Superposición vectorial: <code>g=Σgᵢ</code>. Punto con g=0 entre dos masas: iguala GM₁/r₁²=GM₂/r₂² con r₁+r₂=d.</li><li>Fuera de una esfera: como masa puntual en el centro. Variación con la altura: <code>g=<span class='fr'><span>g₀R²</span><span>(R+h)²</span></span></code>.</li></ul><p><b>Satélites</b></p><ul><li>Fuerza gravitatoria = centrípeta: <code><span class='fr'><span>GMm</span><span>r²</span></span>=<span class='fr'><span>mv²</span><span>r</span></span></code> ⇒ v=√(GM/r) (no depende de m). <code>T=<span class='fr'><span>2πr</span><span>v</span></span></code>. Geoestacionario: T=24 h, órbita ecuatorial, h≈36 000 km.</li></ul><div class='box tip'><b class='l'>Errores típicos</b>Usar R en vez de R+h · no pasar km a m · perder el signo de la energía potencial.</div>", "Energía": "<p><b>Conservación</b></p><ul><li>Fuerza conservativa: <code>E_c+E_p=cte</code>, <code>W=−ΔE_p=ΔE_c</code>. Energía total de órbita ligada es negativa.</li></ul><p><b>Preguntas típicas</b></p><ul><li>Energía para poner un satélite en órbita: <code>ΔE=E_órbita−E_superficie</code> (con la energía en superficie incluida E_c=0 si parte del reposo).</li><li>Superficies equipotenciales: esferas concéntricas, ⟂ a las líneas de g; el trabajo sobre ellas es 0.</li></ul><div class='box tip'><b class='l'>Errores típicos</b>Confundir la energía de la órbita con la que hay que aportar · olvidar que E de órbita ligada es negativa.</div>", "Campo el": "<p><b>Analogía gravitatorio–eléctrico</b></p><ul><li>Ambas 1/r², centrales y conservativas. <b>Diferencia</b>: la gravitatoria siempre atrae; la eléctrica puede atraer o repeler (+/−).</li></ul><p><b>Partículas en campos</b></p><ul><li>Campo uniforme: <code>a=<span class='fr'><span>qE</span><span>m</span></span></code> (parábola si entra perpendicular). Acelerada por ΔV: <code>qΔV=½mv²</code> ⇒ v=√(2qΔV/m).</li><li>Conductor en equilibrio: E=0 dentro, V constante, carga en la superficie.</li></ul><p><b>Potencial</b></p><ul><li>V en un punto = suma de potenciales (escalar). Trabajo del campo = q(V_i−V_f). Al soltar carga positiva se mueve hacia V decreciente.</li></ul><div class='box tip'><b class='l'>Errores típicos</b>Sumar campos como escalares · fallar el signo de las cargas en V.</div>", "Campo mag": "<p><b>Fuentes de B</b></p><ul><li>Hilo, espira, solenoide. <b>Ampère</b>: <code>∮B·dl=μ₀I</code>. No existen monopolos: <code>∮B·dS=0</code> (líneas cerradas). B no es conservativo.</li></ul><p><b>Fuerzas</b></p><ul><li>Entre hilos paralelos: <code><span class='fr'><span>F</span><span>L</span></span>=<span class='fr'><span>μ₀I₁I₂</span><span>2πd</span></span></code> (misma dirección se atraen).</li><li>Aplicaciones: espectrómetro de masas (R∝m/q), ciclotrón, selector de velocidades.</li></ul><div class='box tip'><b class='l'>Errores típicos</b>Sentido de F con electrones · confundir q, m y v en R.</div>", "Inducción": "<p><b>Causas de variación de Φ</b></p><ul><li>Cambia B, cambia S o cambia θ. Conductor móvil: <code>ε=B·L·v</code>.</li></ul><p><b>Lenz</b></p><ul><li>La corriente inducida crea un campo que <b>se opone</b> a la variación de flujo: si Φ aumenta, B_ind en sentido contrario; si disminuye, mismo sentido.</li></ul><p><b>Transformador</b></p><ul><li>Ideal: <code><span class='fr'><span>V₁</span><span>V₂</span></span>=<span class='fr'><span>N₁</span><span>N₂</span></span></code> y <code>V₁I₁=V₂I₂</code> (potencia conservada). Solo funciona con corriente variable.</li></ul><div class='box tip'><b class='l'>Errores típicos</b>Signo de ε · olvidar cosθ en Φ · usar Δ en vez de derivada o al revés.</div>", "MAS": "<p><b>Relaciones útiles</b></p><ul><li><code>v=±ω√(A²−x²)</code> · v máx en x=0 (Aω) · a máx en x=±A (ω²A) · <code>E_c=½kA²cos²(ωt+φ)</code>, <code>E_p=½kx²</code>.</li><li>Determinar φ₀ con las condiciones iniciales (x₀ y signo de v₀).</li></ul><p><b>Sistemas</b></p><ul><li>Muelle: T no depende de A ni de g. Péndulo (ángulos pequeños): <code>T=2π√(<span class='fr'><span>l</span><span>g</span></span>)</code>, no depende de m.</li></ul><div class='box tip'><b class='l'>Errores típicos</b>Calculadora en grados · fase inicial sin mirar el signo de v₀.</div>", "Ondas": "<p><b>Clasificación</b></p><ul><li>Mecánicas (necesitan medio) / electromagnéticas (no). Transversales / longitudinales (sonido). Periodo T (tiempo) y λ (espacio).</li><li>No confundas la <b>velocidad de la onda</b> v=λf con la de la partícula <code><span class='fr'><span>∂y</span><span>∂t</span></span>=Aω·cos(ωt−kx)</code>.</li></ul><p><b>Fase</b></p><ul><li>Desfase entre dos puntos: <code>Δφ=kΔx</code>; entre dos instantes: <code>Δφ=ωΔt</code>. En fase: múltiplos de 2π.</li></ul><p><b>Estacionarias</b></p><ul><li><code>y=2A·cos(kx)·sin(ωt)</code>. Nodos: <code>x=<span class='fr'><span>(2n+1)λ</span><span>4</span></span></code> (extremo libre en x=0) · vientres: x=nλ/2. Cuerda fija: <code>fₙ=<span class='fr'><span>nv</span><span>2L</span></span></code>.</li></ul><p><b>Fenómenos</b></p><ul><li>Reflexión, refracción, difracción (λ comparable al obstáculo), interferencia (superposición), polarización (solo transversales).</li></ul><div class='box tip'><b class='l'>Errores típicos</b>Confundir v de la onda con la de la partícula · olvidar el 2π en k y ω.</div>", "Óptica": "<p><b>Reflexión y refracción</b></p><ul><li>Leyes: rayo incidente, normal y reflejado en un plano; ángulo incidente = reflejado. Refracción: al pasar a n mayor, el rayo se acerca a la normal. Reflexión total si θ&gt;θ_L (fibra óptica).</li><li>La frecuencia no cambia al cambiar de medio; cambian v y λ (<code>λ=<span class='fr'><span>λ₀</span><span>n</span></span></code>).</li></ul><p><b>Lentes y espejos (DIN)</b></p><ul><li>Lente convergente (f′&gt;0): objeto fuera de f → imagen real e invertida; dentro de f → virtual y derecha (lupa). Divergente: siempre virtual, derecha y menor.</li><li>Espejos: <code><span class='fr'><span>1</span><span>s</span></span>+<span class='fr'><span>1</span><span>s′</span></span>=<span class='fr'><span>1</span><span>f</span></span>=<span class='fr'><span>2</span><span>R</span></span></code>. Miopía: lente divergente; hipermetropía: convergente.</li></ul><div class='box tip'><b class='l'>Errores típicos</b>Convenio DIN mal aplicado · medir ángulos con la superficie y no con la normal.</div>", "Relatividad": "<p><b>Postulados y consecuencias</b></p><ul><li>1) Las leyes son iguales en todo sistema inercial. 2) c es la misma para todos. Consecuencias: simultaneidad relativa, dilatación temporal, contracción de longitudes (en la dirección del movimiento).</li></ul><p><b>Dinámica relativista</b></p><ul><li><code>p=γmv</code> · <code>E²=(pc)²+(mc²)²</code> · <code>E_c=(γ−1)mc²</code> · ninguna masa alcanza c.</li></ul><div class='box tip'><b class='l'>Errores típicos</b>Aplicar la dilatación al observador equivocado (Δt₀ es el tiempo propio).</div>", "Cuántica": "<p><b>Crisis clásica</b></p><ul><li>Cuerpo negro (catástrofe ultravioleta) → hipótesis de Planck. Fotoeléctrico: bajo f₀ no hay emisión por mucha intensidad; la intensidad cambia el <b>nº</b> de electrones, no su E_c.</li></ul><p><b>Dualidad</b></p><ul><li>Luz y materia son onda y partícula: <code>λ=<span class='fr'><span>h</span><span>p</span></span></code>. Principio de incertidumbre: no se pueden conocer a la vez x y p con precisión arbitraria.</li></ul><p><b>Átomo</b></p><ul><li>Rutherford (núcleo) → Bohr (niveles cuantizados). Emisión/absorción de fotón al saltar: <code>hf=|E_i−E_f|</code>; espectros de líneas.</li></ul><div class='box tip'><b class='l'>Errores típicos</b>Mezclar eV y J · usar λ en m con hc en eV·nm.</div>", "Nuclear": "<p><b>Estabilidad y energía</b></p><ul><li>Fuerza nuclear fuerte (corto alcance). E de enlace por nucleón máxima en el Fe-56: fusión de ligeros y fisión de pesados liberan energía. <code>1 u=1,66·10⁻²⁷ kg ≡ 931,5 MeV</code>.</li></ul><p><b>Desintegraciones</b></p><ul><li>α: (A−4, Z−2) · β⁻: (A, Z+1) · γ: sin cambio de A ni Z. Vida media <code>τ=<span class='fr'><span>1</span><span>λ</span></span></code>; actividad en becquerel (Bq).</li></ul><p><b>Reacciones</b></p><ul><li>Fisión: U-235 + n → fragmentos + neutrones (reacción en cadena). Fusión: p+p… en el Sol.</li></ul><p><b>Partículas</b></p><ul><li>Interacciones: gravitatoria, electromagnética, fuerte y débil. Materia: quarks y leptones; mediadores: fotón, gluones, W, Z; bosón de Higgs.</li></ul><div class='box tip'><b class='l'>Errores típicos</b>Calcular Δm con masas atómicas mal · confundir u con MeV.</div>"};
const EXT={"Métodos":"∫ <span class='fr'><span>1</span><span>x²−1</span></span> dx=½[∫ <span class='fr'><span>1</span><span>x−1</span></span> dx−∫ <span class='fr'><span>1</span><span>x+1</span></span> dx]=<code>½ln|<span class='fr'><span>x−1</span><span>x+1</span></span>|+C</code>.","Matrices": "Si A=(1 2 | 3 4): |A|=4−6=−2 y A⁻¹=(<span class='fr'><span>1</span><span>−2</span></span>)·(4 −2 | −3 1)=(−2 1 | <span class='fr'><span>3</span><span>2</span></span> −<span class='fr'><span>1</span><span>2</span></span>).", "Determinantes": "A=(2 1 0 | 0 3 1 | 1 0 1). Sarrus: positivos 6+1+0=7, negativos 0 ⇒ <code>|A|=7</code> (invertible).", "Sistemas": "mx+y=1, x+my=1 ⇒ <code>|A|=m²−1</code>. m≠±1: SCD, x=y=<span class='fr'><span>1</span><span>m+1</span></span>. m=1: SCI (x+y=1). m=−1: −x+y=1 y x−y=1 suman 0=2 ⇒ SI.", "Vectores": "u=(1,2,0), v=(0,1,3): u×v=(6,−3,1), área del paralelogramo=√46≈6,78.", "Rectas": "Plano por A(1,0,0), B(0,1,0), C(0,0,1): AB=(−1,1,0), AC=(−1,0,1), n=AB×AC=(1,1,1) ⇒ <code>x+y+z=1</code>.", "Distancias": "d(O, x+y+z=1)=<span class='fr'><span>|−1|</span><span>√3</span></span>=<span class='fr'><span>1</span><span>√3</span></span>≈0,58.", "Límites": "lim(x→∞)(1+<span class='fr'><span>2</span><span>x</span></span>)ˣ es 1^∞ ⇒ e^{lim x·(<span class='fr'><span>2</span><span>x</span></span>)}=<code>e²</code>.", "Derivadas": "f=x²eˣ ⇒ f′=(2x+x²)eˣ. En x=1: f=e, f′=3e ⇒ tangente <code>y−e=3e(x−1)</code>.", "Estudio": "f=x³−3x: f′=3x²−3=0 ⇒ x=±1; f″=6x. x=−1 máximo (f=2), x=1 mínimo (f=−2), inflexión en x=0.", "Primitivas": "∫(3x²+<span class='fr'><span>2</span><span>x</span></span>)dx = <code>x³+2ln|x|+C</code>.", "Integral": "Área entre y=x e y=x² en [0,1]: ∫(x−x²)dx=<span class='fr'><span>1</span><span>2</span></span>−<span class='fr'><span>1</span><span>3</span></span>=<code><span class='fr'><span>1</span><span>6</span></span></code>.", "Probabilidad": "P(A)=0,3, P(B|A)=0,8, P(B|Ā)=0,1: P(B)=0,24+0,07=0,31 y <code>P(A|B)=<span class='fr'><span>0,24</span><span>0,31</span></span>≈0,77</code>.", "Variable binomial": "X~B(5; 0,5): P(X=2)=C(5,2)·0,5⁵=<span class='fr'><span>10</span><span>32</span></span>=<code>0,3125</code>.", "Variable normal": "X~N(70,10): P(X>85)=P(Z>1,5)=1−0,9332=<code>0,0668</code>.", "Interacción": "A h=R sobre la superficie, r=2R ⇒ <code>g=<span class='fr'><span>g₀</span><span>4</span></span>≈2,45 m∕s²</code>.", "Energía": "Escape desde la Tierra: v=√(2·9,8·6,37·10⁶)≈<code>1,12·10⁴ m∕s</code>.", "Campo el": "q=2 μC, r=30 cm: E=<span class='fr'><span>9·10⁹·2·10⁻⁶</span><span>0,3²</span></span>=<code>2·10⁵ N∕C</code>.", "Campo mag": "Protón v=10⁶ m∕s, B=0,1 T: R=<span class='fr'><span>mv</span><span>qB</span></span>=<span class='fr'><span>1,67·10⁻²⁷·10⁶</span><span>1,6·10⁻¹⁹·0,1</span></span>≈<code>0,10 m</code>.", "Inducción": "ΔΦ=0,04 Wb en 0,2 s ⇒ <code>|ε|=0,2 V</code>.", "MAS": "k=100 N∕m, m=1 kg: ω=√100=10 rad∕s, <code>T=<span class='fr'><span>2π</span><span>10</span></span>≈0,63 s</code>.", "Ondas": "y=0,2·sin(4πt−2πx): ω=4π ⇒ f=2 Hz; k=2π ⇒ λ=1 m; <code>v=2 m∕s</code>.", "Óptica": "f′=10 cm, s=−30 cm: <span class='fr'><span>1</span><span>s′</span></span>=<span class='fr'><span>1</span><span>10</span></span>−<span class='fr'><span>1</span><span>30</span></span> ⇒ <code>s′=15 cm</code>; aumento <span class='fr'><span>s′</span><span>s</span></span>=−0,5.", "Relatividad": "v=0,8c ⇒ γ=<span class='fr'><span>1</span><span>√(1−0,64)</span></span>=<code>1,67</code>; un reloj en movimiento marca Δt=1,67·Δt₀.", "Cuántica": "λ=500 nm ⇒ E=<span class='fr'><span>1240</span><span>500</span></span>=<code>2,48 eV</code>.", "Nuclear": "T½=10 días: tras 30 días queda (½)³=<code><span class='fr'><span>1</span><span>8</span></span></code> de la muestra."};
const exFor=t=>{t=t.replace(/<[^>]*>/g,'');for(const k in EXT)if(t.startsWith(k))return (MORE[k]||'')+'<div class="box ex"><b class="l">Ejemplo resuelto</b>'+EXT[k]+'</div>';return ''};
const BLK={mates:[['Bloque B · Análisis',['der','int']],['Bloque C · Geometría',['geo']],['Bloque D · Álgebra',['alg']],['Bloque E · Probabilidad y Estadística',['prob']]],fisica:[['Bloque 1 · Campo gravitatorio',['grav']],['Bloque 2 · Campo electromagnético',['elec','mag']],['Bloque 3 · Vibraciones y ondas',['ond']],['Bloque 4 · Física relativista, cuántica y nuclear',['mod']]]};
for(const sb of ['mates','fisica']){const out=[];BLK[sb].forEach(([b,ids])=>ids.forEach(id=>{const o=T[sb].find(x=>x.id==id),ps=o.h.split('<h3>'),h0=ps[0].replace(/<span class="tag">.*?<\/span>/,'');
 if(ps.length==1){out.push({id,n:o.n,b,g:o.g,h:h0+exFor(o.n)});return}
 ps.slice(1).forEach((p,i)=>{const q=p.split('</h3>');out.push({id:id+i,n:q[0],b,g:o.g,h:q.slice(1).join('</h3>')+exFor(q[0])})})}));T[sb]=out}
let sub='mates',cur=T.mates[0],last=null,sampleFn=null;
const $=i=>document.getElementById(i);
function draw(){
 $('tabs').innerHTML=['mates','fisica'].map(s=>`<button class="${s==sub?'on':''}" data-s="${s}">${s=='mates'?'Matemáticas II':'Física'}</button>`).join('');
 let h='',lb='';T[sub].forEach(t=>{if(t.b!=lb){h+=(lb?'</div></div>':'')+`<div class="blk"><h4>${t.b}</h4><div class="chips">`;lb=t.b}h+=`<button class="${t==cur?'on':''}" data-t="${t.id}">${t.n}</button>`});$('chips').innerHTML=h+'</div></div>';
 $('notes').innerHTML=`<span class="bt">${cur.b}</span><h2>${cur.n}</h2>`+cur.h;$('info').innerHTML=INFO[sub];
}
$('tabs').onclick=e=>{const s=e.target.dataset.s;if(s){sub=s;cur=T[s][0];draw()}};
$('chips').onclick=e=>{const t=e.target.dataset.t;if(t){cur=T[sub].find(x=>x.id==t);draw()}};
function showEx(q,a){$('q').textContent=q;$('sol').textContent=a;$('sol').style.display='none';$('show').textContent='Ver solución'}
$('gen').onclick=()=>{last=cur.g();showEx(last.q,last.a)};
$('show').onclick=()=>{const s=$('sol');const o=s.style.display=='block';s.style.display=o?'none':'block';$('show').textContent=o?'Ver solución':'Ocultar solución'};
$('ai').onclick=async()=>{
 if(!sampleFn)return;$('st').textContent='Generando con IA…';$('ai').disabled=true;
 try{const r=await sampleFn(`Eres profesor de ${sub=='mates'?'Matemáticas II':'Física'} de 2º de Bachillerato en las Islas Baleares (PAU/UIB). Crea UN ejercicio original y aleatorio (semilla ${Math.random().toString(36).slice(2,8)}) del tema "${cur.n}", con nivel y estilo de examen PAU UIB (con apartados a, b, c si procede). Responde en español con este formato exacto, sin nada más:\nENUNCIADO:\n<texto>\nSOLUCIÓN:\n<resolución paso a paso>`,{cache:false});
  const [q,a]=r.text.split(/SOLUCI[ÓO]N:/i);showEx((q||'').replace(/ENUNCIADO:/i,'').trim(),(a||'Sin solución.').trim());$('st').textContent='Ejercicio generado por IA. Revisa siempre la solución.'}
 catch(e){$('st').textContent=e&&e.code=='not_granted'?'Permiso denegado para usar la IA.':'No se pudo generar ahora; prueba otra vez.'}
 $('ai').disabled=false};
draw();
(async()=>{try{const s=await window.claude?.use('sample');if(s){sampleFn=s;$('ai').style.display=''}}catch(e){}})();
</script></body></html>
